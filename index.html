<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yebishe.com</title>
    <style>
        /* Основные настройки страницы */
        body {
            background-color: #000000; /* Черный фон */
            color: #ffffff; /* Белый текст */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Центрируем всё по вертикали */
            min-height: 100vh; /* Высота на весь экран */
            text-align: center;
        }

        /* Контейнер, чтобы контент не растягивался на огромных мониторах */
        .content-wrapper {
            max-width: 800px;
            padding: 20px;
        }

        /* Настройки картинки */
        img {
            max-width: 100%; /* Картинка будет сжиматься на телефонах */
            height: auto;
            border-radius: 8px; /* Немного скруглил углы */
            margin-bottom: 30px; /* Отступ от картинки до текста */
        }

        /* Настройки текста */
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cccccc; /* Светло-серый цвет для комфортного чтения */
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <!-- Картинка загружается по прямой ссылке -->
        <img src="https://argumentua.com/sites/default/files/imagecache/Full_tekst_600x/article/1198052.jpg" alt="Главное фото">

        <!-- Текст страницы -->
        <p>
            TRUE YEBISHE
        </p>
    </div>

</body>
</html>
